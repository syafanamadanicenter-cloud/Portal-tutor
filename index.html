<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Tutor Yayasan Syafana</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1F4E78">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="loading" class="center">Memuat...</div>

<section id="loginView" class="center" hidden>
  <form id="loginForm" class="loginbox">
    <h1>Portal Tutor</h1>
    <p class="muted">Yayasan Syafana</p>
    <label>Email</label>
    <input type="email" id="email" autocomplete="username" required>
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div id="loginErr" class="err"></div>
    <button type="submit" class="btn">Masuk</button>
    <a href="#" id="forgot" class="small">Lupa password?</a>
  </form>
</section>

<section id="appView" hidden>
  <header class="topbar">
    <button id="menuBtn" aria-label="Menu" class="iconbtn">&#9776;</button>
    <div id="pageTitle" class="ttl">Profil</div>
  </header>
  <div id="scrim" class="scrim" hidden></div>
  <nav id="drawer" class="drawer">
    <div class="who"><b id="whoName"></b><span id="whoRole" class="muted"></span></div>
    <div id="menuItems"></div>
    <button id="logout" class="menuitem out">Keluar</button>
  </nav>
  <main id="content"></main>
</section>

<div id="toast" class="toast" hidden></div>
<script type="module" src="app.js"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
