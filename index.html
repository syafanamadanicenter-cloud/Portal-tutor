<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal Tutor Yayasan Syafana</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading" class="center">Memuat...</div>

<section id="loginView" class="center" hidden>
  <form id="loginForm" class="loginbox">
    <h1>Portal Tutor</h1>
    <p class="muted">Yayasan Syafana</p>
    <label>Email</label>
    <input type="email" id="email" autocomplete="username" required>
    <label>Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <div id="loginErr" class="err"></div>
    <button type="submit" class="btn">Masuk</button>
    <a href="#" id="forgot" class="small">Lupa password?</a>
  </form>
</section>

<section id="appView" hidden>
  <header class="topbar">
    <button id="menuBtn" aria-label="Menu" class="iconbtn">&#9776;</button>
    <div id="pageTitle" class="ttl">Profil</div>
  </header>
  <div id="scrim" class="scrim" hidden></div>
  <nav id="drawer" class="drawer">
    <div class="who"><b id="whoName"></b><span id="whoRole" class="muted"></span></div>
    <div id="menuItems"></div>
    <button id="logout" class="menuitem out">Keluar</button>
  </nav>
  <main id="content"></main>
</section>

<div id="toast" class="toast" hidden></div>
<script>
(function(){var msgs=[];
function show(){var l=document.getElementById("loading");if(!l||l.hidden)return;
l.textContent="";var b=document.createElement("div");b.style.cssText="max-width:320px;font-size:13px;color:#b00020";
var h=document.createElement("b");h.textContent="Aplikasi gagal dimuat.";b.appendChild(h);
var t=document.createElement("p");t.textContent='Periksa file firebase-config.js: harus diawali "export const firebaseConfig = {", berisi 6 nilai, dan TIDAK boleh ada baris import atau initializeApp.';b.appendChild(t);
var m=document.createElement("p");m.textContent=msgs.join(" | ");m.style.color="#555";b.appendChild(m);l.appendChild(b);}
window.addEventListener("error",function(e){msgs.push(String(e.message||"error"));setTimeout(show,400)});
window.addEventListener("unhandledrejection",function(e){msgs.push(String((e.reason&&e.reason.message)||e.reason));setTimeout(show,400)});
setTimeout(function(){if(!window.__appStarted)show()},6000);})();
</script>
<script type="module" src="app.js"></script>
<script>/* versi web biasa: bersihkan sisa cache aplikasi lama jika ada */
if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});}
if(window.caches){caches.keys().then(k=>k.forEach(x=>caches.delete(x))).catch(()=>{});}</script>
</body>
</html>
