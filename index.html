<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Portal Tutor Yayasan Syafana</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loading" class="center"><div class="spinner"></div><div class="muted">Memuat...</div></div>

<section id="loginView" class="center" hidden>
  <form id="loginForm" class="loginbox" autocomplete="on">
    <div class="logowrap xl">
      <img src="logo.png" alt="Logo Yayasan Syafana" onerror="this.parentNode.classList.add('nologo')">
      <span class="mono">S</span>
    </div>
    <h1>Portal Tutor</h1>
    <p class="sub">Yayasan Syafana</p>

    <label for="email">Email</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <input type="email" id="email" autocomplete="username" placeholder="nama@email.com" required>
    </div>

    <label for="password">Password</label>
    <div class="field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <input type="password" id="password" autocomplete="current-password" placeholder="Password Anda" required>
      <button type="button" id="togglePw" class="eye" aria-label="Tampilkan password">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div id="loginErr" class="err"></div>
    <button type="submit" class="btn">Masuk</button>
    <a href="#" id="forgot" class="small">Lupa password?</a>
    <div class="foot">&copy; Yayasan Syafana</div>
  </form>
</section>

<section id="appView" hidden>
  <header class="topbar">
    <button id="menuBtn" aria-label="Menu" class="iconbtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div id="pageTitle" class="ttl">Profil</div>
    <div class="logowrap sm">
      <img src="logo.png" alt="" onerror="this.parentNode.classList.add('nologo')">
      <span class="mono">S</span>
    </div>
  </header>
  <div id="scrim" class="scrim" hidden></div>
  <nav id="drawer" class="drawer">
    <div class="brand">
      <div class="logowrap md">
        <img src="logo.png" alt="" onerror="this.parentNode.classList.add('nologo')">
        <span class="mono">S</span>
      </div>
      <div><b>Syafana</b><span>Portal Tutor</span></div>
    </div>
    <div class="who">
      <div class="avatar" id="whoAvatar"></div>
      <div class="whotxt"><b id="whoName"></b><span id="whoRole" class="rolepill"></span></div>
    </div>
    <div id="menuItems" class="menulist"></div>
    <button id="logout" class="menuitem out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
      <span>Keluar</span>
    </button>
  </nav>
  <main id="content"></main>
</section>

<div id="toast" class="toast" hidden></div>
<script>
(function(){var msgs=[];
function show(){var l=document.getElementById("loading");if(!l||l.hidden)return;
l.textContent="";var b=document.createElement("div");b.style.cssText="max-width:320px;font-size:13px;color:#fca5a5";
var h=document.createElement("b");h.textContent="Aplikasi gagal dimuat.";b.appendChild(h);
var t=document.createElement("p");t.textContent='Periksa file firebase-config.js: harus diawali "export const firebaseConfig = {", berisi 6 nilai, dan TIDAK boleh ada baris import atau initializeApp.';b.appendChild(t);
var m=document.createElement("p");m.textContent=msgs.join(" | ");m.style.color="#94a3b8";b.appendChild(m);l.appendChild(b);}
window.addEventListener("error",function(e){msgs.push(String(e.message||"error"));setTimeout(show,400)});
window.addEventListener("unhandledrejection",function(e){msgs.push(String((e.reason&&e.reason.message)||e.reason));setTimeout(show,400)});
setTimeout(function(){if(!window.__appStarted)show()},6000);})();
</script>
<script type="module" src="app.js"></script>
<script>
/* tombol tampilkan/sembunyikan password */
document.getElementById("togglePw").addEventListener("click",function(){var i=document.getElementById("password");i.type=i.type==="password"?"text":"password";});
/* versi web biasa: bersihkan sisa cache aplikasi lama jika ada */
if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister())).catch(()=>{});}
if(window.caches){caches.keys().then(k=>k.forEach(x=>caches.delete(x))).catch(()=>{});}
</script>
</body>
</html>
